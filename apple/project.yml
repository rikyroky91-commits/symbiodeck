# Jarvis per iPhone e Apple Watch. Il progetto Xcode si genera con XcodeGen (sul Mac di GitHub Actions):
#   brew install xcodegen && cd apple && xcodegen generate
# Vedi .github/workflows/jarvis-ios.yml: compila senza firma e pubblica l'IPA da installare in sideload.
name: JarvisRemote
options:
  bundleIdPrefix: it.rikyr
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: "NO"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - target: JarvisWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Per parlare con Jarvis."
        NSSpeechRecognitionUsageDescription: "Per trasformare in testo quello che dici a Jarvis."
        NSLocalNetworkUsageDescription: "Per raggiungere Jarvis sul tuo PC in rete locale."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.rikyr.jarvis
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JarvisWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        WKApplication: true
        WKCompanionAppBundleIdentifier: it.rikyr.jarvis
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.rikyr.jarvis.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
