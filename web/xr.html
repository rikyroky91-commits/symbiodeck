<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#02060b">
<title>Jarvis XR</title>
<style>
  html, body { margin: 0; height: 100%; background: #02060b; color: #dff6ff; overflow: hidden;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #avvio { position: fixed; right: 24px; top: 18px; text-align: right; z-index: 2;
    transition: opacity .5s; }
  #avvio.nascosto { opacity: 0; pointer-events: none; }
  #entra { font: 700 18px "Segoe UI", Roboto, sans-serif; letter-spacing: 3px; color: #02131a; background: #39d5ff;
    border: 0; border-radius: 40px; padding: 16px 34px; box-shadow: 0 0 34px rgba(57, 213, 255, .6); cursor: pointer;
    animation: respiro 2.4s ease-in-out infinite; }
  #entra:disabled { background: #2a3a46; color: #8aa0b3; box-shadow: none; animation: none; cursor: default; }
  #nota { margin-top: 10px; font: 12px Consolas, "Roboto Mono", monospace; color: rgba(223, 246, 255, .6);
    max-width: 460px; line-height: 1.5; margin-left: auto; }
  #nota b { color: #8ff0ff; font-weight: 600; }
  #logo { position: fixed; left: 24px; top: 20px; font: 600 18px Consolas, monospace; letter-spacing: 8px; color: #39d5ff;
    text-shadow: 0 0 14px rgba(57, 213, 255, .7); z-index: 2; pointer-events: none; }
  #logo small { display: block; font-size: 10px; letter-spacing: 4px; color: rgba(143, 240, 255, .55); margin-top: 4px; }
  @keyframes respiro { 50% { box-shadow: 0 0 60px rgba(57, 213, 255, .9); } }
  #abbina { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0; z-index: 3;
    text-align: center; padding: 34px 50px; border-radius: 22px; background: rgba(2, 14, 22, .92);
    border: 2px solid #39d5ff; box-shadow: 0 0 60px rgba(57, 213, 255, .45); transition: all .4s; pointer-events: none; }
  #abbina.visto { opacity: 1; transform: translate(-50%, -50%); }
  #abbina small { display: block; font: 600 14px Consolas, monospace; letter-spacing: 6px; color: #8ff0ff; }
  #abbina b { display: block; font: 700 92px/1.1 Consolas, monospace; letter-spacing: 18px; color: #fff;
    text-shadow: 0 0 24px #39d5ff; margin: 14px 0; }
  #abbina span { font-size: 16px; color: rgba(223, 246, 255, .75); }
</style>
</head>
<body>
<div id="logo">JARVIS XR<small>OLOGRAMMI DEL PC · QUEST 3</small></div>
<div id="abbina"><small>CODICE DEL VISORE</small><b id="codice">· · · ·</b>
  <span>Jarvis te lo chiede sul tablet: rispondi «Consenti»</span></div>
<div id="avvio">
  <button id="entra" disabled>CONTROLLO…</button>
  <div id="nota"></div>
</div>
<script type="module" src="xr.js"></script>
</body>
</html>
