<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #07090d; color: #e8eef6; font-family: Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .anello { width: 54px; height: 54px; border-radius: 50%; border: 4px solid rgba(255,255,255,.08); border-top-color: #35c8ff;
    animation: giro 1s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  h1 { font-weight: 300; font-size: 26px; margin: 6px 0 0; }
  p { color: #7d8a9c; margin: 0; font-size: 14px; max-width: 520px; line-height: 1.5; }
  .ora { font-size: 64px; font-weight: 200; }
  button { margin-top: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12);
    background: #10151d; color: #e8eef6; font: inherit; }
</style>
</head>
<body>
  <div class="ora" id="ora">--:--</div>
  <div class="anello"></div>
  <h1 id="titolo">In attesa del PC…</h1>
  <p id="testo">Il pannello si collega da solo appena il PC è acceso e il programma "Pannello" è in esecuzione.
     Va bene sia col cavo USB sia in Wi-Fi sulla stessa rete.</p>
  <button onclick="window.Pannello && window.Pannello.apriAndroid()">Apri Android</button>
<script>
  // Tablet mai abbinato: istruzioni per farlo (in italiano e in inglese)
  if (window.Pannello && window.Pannello.abbinato && !window.Pannello.abbinato()) {
    var it = (navigator.language || "it").toLowerCase().indexOf("it") === 0;
    document.getElementById("titolo").textContent = it ? "Cerco il PC…" : "Looking for your PC…";
    document.getElementById("testo").innerHTML = it
      ? "Sul PC avvia il server del Pannello e, nelle impostazioni, premi <b>📲 Abbina un tablet</b>.<br>" +
        "Il tablet lo trova da solo, sulla stessa rete Wi-Fi o col cavo USB."
      : "On your PC, start the Panel server and click <b>📲 Abbina un tablet</b> (pair a tablet) in its settings.<br>" +
        "The tablet finds it on its own, over the same Wi-Fi network or a USB cable.";
  }
  function ora() { var d = new Date(); document.getElementById("ora").textContent =
    ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  ora(); setInterval(ora, 10000);
</script>
</body>
</html>
