name: Jarvis per iPhone e Apple Watch (IPA non firmato)

on:
  push:
    branches: [ main, jarvis-in-prova ]
    paths: [ "apple/**", ".github/workflows/jarvis-ios.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write   # per pubblicare la release con l'IPA

    steps:
      - uses: actions/checkout@v4

      - name: Strumenti
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Genera il progetto Xcode
        working-directory: apple
        run: xcodegen generate

      - name: Compila (senza firma)
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -project JarvisRemote.xcodeproj \
            -scheme Jarvis \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80

      - name: Impacchetta l'IPA
        working-directory: apple
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Jarvis.app" | head -1)
          if [ -z "$APP" ]; then echo "Jarvis.app non prodotta"; exit 1; fi
          echo "--- app per l'orologio dentro l'IPA ---"
          ls -d "$APP"/Watch/*.app || { echo "ATTENZIONE: app per Apple Watch assente"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Jarvis-unsigned.ipa Payload
          ls -lh Jarvis-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-unsigned-ipa
          path: apple/Jarvis-unsigned.ipa
          if-no-files-found: error

      # link pubblico apribile da Safari sull'iPhone; non diventa la release "latest" (quella è l'APK del tablet)
      - name: Pubblica la release
        if: github.ref == 'refs/heads/main'   # dai rami di prova solo la verifica, niente release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jarvis-ios-${{ github.run_number }}"
          gh release create "$TAG" apple/Jarvis-unsigned.ipa \
            --title "Jarvis per iPhone e Apple Watch ($TAG)" \
            --notes "IPA non firmato con l'app per iPhone e quella per Apple Watch. Si installa in sideload (Sideloadly, AltStore o SideStore). Commit ${{ github.sha }}" \
            --latest=false
